services:
  - type: web
    name: festival-task-manager
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ORGANIZER_PASSWORD
        value: "1965"
      - key: ADMIN_PASSWORD
        value: "19907"
      - key: DATABASE_URL
        fromDatabase:
          name: festival-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: "festival-tasks"

databases:
  - name: festival-db
    plan: free
    databaseName: festival
    user: festival_user
